name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  web:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build

  e2e:
    name: Flow and visual gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Flow gate
        run: npm run check:flow
      - name: Visual gate
        run: npm run check:ui
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: .artifacts/ui
          if-no-files-found: ignore
