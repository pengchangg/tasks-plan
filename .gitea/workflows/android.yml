name: Android APK

# 手动触发：Actions 页面选本 workflow → Run workflow → 下载 growjoy-apk 产物。
# 不挂在 push 上：每跑一次要重新拉 ~1 GB 的 Android SDK，和部署无关。
on:
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    # 与 deploy.yml 同一个自建 runner（debian13，无 Java / 无 Android SDK），
    # 工具链在下面几步里现装。
    runs-on: deploy
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # runner 的 HOME 取决于镜像（容器里可能是 /root），这里不写死路径。
      - name: Resolve toolchain paths
        run: |
          echo "ANDROID_HOME=$HOME/.android-sdk" >> "$GITHUB_ENV"
          echo "GRADLE_DIST=$HOME/.gradle-dist" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK 和 Gradle 发行包都很大，缓存命中后一次构建只要 2 分钟左右。
      # shortcut: 缓存服务不可达时只告警不失败，回退到全量下载。
      - name: Cache Android SDK, Gradle dist and caches
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.android-sdk
            ~/.gradle-dist
            ~/.gradle/caches
          key: android-${{ hashFiles('android/**/*.gradle', 'android/gradle.properties') }}

      - name: Install Android SDK
        run: |
          set -eu
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "→ 下载 cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            if command -v unzip >/dev/null 2>&1; then
              unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            else
              python3 -m zipfile -e /tmp/cmdline-tools.zip "$ANDROID_HOME/cmdline-tools"
            fi
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "→ 接受许可、安装 platform 34 + build-tools"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Install Gradle
        run: |
          set -eu
          if [ ! -x "$GRADLE_DIST/gradle-8.9/bin/gradle" ]; then
            echo "→ 下载 gradle 8.9"
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            mkdir -p "$GRADLE_DIST"
            if command -v unzip >/dev/null 2>&1; then
              unzip -q /tmp/gradle.zip -d "$GRADLE_DIST"
            else
              python3 -m zipfile -e /tmp/gradle.zip "$GRADLE_DIST"
            fi
          fi
          echo "$GRADLE_DIST/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: |
          set -eu
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: growjoy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
