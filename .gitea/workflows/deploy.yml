name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    # 自建镜像（debian13 runner 本地 localhost/gha-deploy:1）
    # 已预装 Go / Node / rsync / curl / openssh-client
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 镜像里已装 Go / Node，但工具链自带缓存；这两层管模块与编译、npm tarball。
      # shortcut: 缓存服务不可达时只告警不失败（continue-on-error）。
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      - name: Cache npm tarballs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install from lockfile
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-localhost}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_UNIT: ${{ vars.DEPLOY_UNIT }}
        run: |
          export DEPLOY_HOST="${DEPLOY_HOST:-localhost}"
          export DEPLOY_DIR="${DEPLOY_DIR:-/home/pengchang/growjoy}"
          export DEPLOY_URL="${DEPLOY_URL:-http://192.168.0.208:9080}"
          export DEPLOY_UNIT="${DEPLOY_UNIT:-growjoy}"
          make deploy
